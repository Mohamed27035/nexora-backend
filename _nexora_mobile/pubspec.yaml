name: nexora_mobile

description: "Nexora Mobile App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.7.0

  shared_preferences: ^2.3.2

  flutter_secure_storage: ^9.2.2

  provider: ^6.1.2

  image_picker: ^1.1.2

  fl_chart: ^1.1.1

  google_mlkit_text_recognition: ^0.15.0

  path_provider: ^2.1.5

  share_plus: ^10.0.2

  open_filex: ^4.6.0

  qr_flutter: ^4.1.0

  mobile_scanner: ^5.2.3

  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
   sdk: flutter
  http_parser: ^4.0.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:

  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  min_sdk_android: 21

  
